name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-post-examples.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/check_site.py
      - run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      - run: python scripts/check_build.py
      - run: bundle exec htmlproofer ./_site --disable-external --enforce-https
