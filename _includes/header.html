<header class="site-header" role="banner">
  <div class="wrapper header-inner">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">Mihai Nadăș<span class="site-mark">/notes</span></a>
    <nav class="site-nav" aria-label="Primary navigation">
      {% for path in site.header_pages %}
        {% assign page = site.pages | where: "path", path | first %}
        {% if page.title %}<a class="page-link" href="{{ page.url | relative_url }}">{{ page.title }}</a>{% endif %}
      {% endfor %}
    </nav>
  </div>
</header>
