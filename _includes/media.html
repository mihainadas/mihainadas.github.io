{% assign media = site.data.media[include.id] %}
{% if media %}
<figure class="{{ include.class | default: 'library-media' }}" data-media-id="{{ include.id | escape }}">
  {% if media.mobile_src %}<picture><source media="(max-width: 640px)" srcset="{{ media.mobile_src | relative_url }}" width="{{ media.mobile_width }}" height="{{ media.mobile_height }}">{% endif %}
  <img src="{{ media.src | relative_url }}" width="{{ media.width }}" height="{{ media.height }}" alt="{{ media.alt | escape }}"
    {% if media.variants %}srcset="{% for variant in media.variants %}{{ variant.src | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="(max-width: 760px) calc(100vw - 40px), (max-width: 1176px) 45vw, 520px"{% endif %}
    {% if include.priority %}fetchpriority="high"{% else %}loading="lazy" decoding="async"{% endif %}>
  {% if media.mobile_src %}</picture>{% endif %}
  <figcaption><span>{{ media.label | escape }}</span> {{ media.caption | escape }}</figcaption>
</figure>
{% endif %}
