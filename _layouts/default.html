<!doctype html>
{% include locale.html %}
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
  <body>
    <a class="skip-link" href="#content">{{ ui.skip }}</a>
    {%- include header.html -%}
    <main class="page-content" id="content" aria-label="{{ ui.content }}">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
