<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1110" viewBox="0 0 320 1110" role="img">
  <title>Romanian diacritic restoration under increasing noise</title>
  <desc>Mobile small-multiple chart comparing clean and high-noise word accuracy.</desc>
  <rect width="320" height="1110" rx="20" fill="#111719"/>
  <g font-family="system-ui, sans-serif">
    <text x="22" y="42" fill="#d2a85a" font-family="ui-monospace, monospace" font-size="11" font-weight="700">WORD ACCURACY · PRELIMINARY</text>
    <text x="22" y="81" fill="#f2f0e8" font-size="22" font-weight="700">Clean → high noise</text>
    <g>
      <rect x="22" y="120" width="276" height="188" rx="14" fill="#1b2427"/><text x="42" y="160" fill="#f2f0e8" font-size="19" font-weight="700">Dictionary</text><text x="42" y="203" fill="#efc978" font-size="27" font-weight="700">93.72 → 70.31</text><text x="42" y="246" fill="#9ca5a2" font-size="14">25.0% relative drop</text><rect x="42" y="267" width="218" height="10" rx="5" fill="#3d3221"/><rect x="42" y="267" width="163" height="10" rx="5" fill="#efc978"/>
      <rect x="22" y="332" width="276" height="188" rx="14" fill="#1b2427"/><text x="42" y="372" fill="#f2f0e8" font-size="19" font-weight="700">BiLSTM · 2.4M</text><text x="42" y="415" fill="#e87979" font-size="27" font-weight="700">96.23 → 36.76</text><text x="42" y="458" fill="#9ca5a2" font-size="14">61.8% relative drop</text><rect x="42" y="479" width="218" height="10" rx="5" fill="#432727"/><rect x="42" y="479" width="83" height="10" rx="5" fill="#e87979"/>
      <rect x="22" y="544" width="276" height="188" rx="14" fill="#1b2427"/><text x="42" y="584" fill="#f2f0e8" font-size="19" font-weight="700">ByT5</text><text x="42" y="627" fill="#8bb5ff" font-size="27" font-weight="700">92.00 → 60.71</text><text x="42" y="670" fill="#9ca5a2" font-size="14">34.0% relative drop</text><rect x="42" y="691" width="218" height="10" rx="5" fill="#263545"/><rect x="42" y="691" width="143" height="10" rx="5" fill="#8bb5ff"/>
      <rect x="22" y="756" width="276" height="188" rx="14" fill="#1b2427"/><text x="42" y="796" fill="#f2f0e8" font-size="19" font-weight="700">Qwen3 LoRA · 1.7B</text><text x="42" y="839" fill="#b9d98d" font-size="27" font-weight="700">48.99 → 37.60</text><text x="42" y="882" fill="#9ca5a2" font-size="14">23.2% drop · low ceiling</text><rect x="42" y="903" width="218" height="10" rx="5" fill="#30402d"/><rect x="42" y="903" width="84" height="10" rx="5" fill="#b9d98d"/>
    </g>
    <text x="22" y="994" fill="#f2f0e8" font-size="16" font-weight="700">Winner changed with the input.</text><text x="22" y="1027" fill="#9ca5a2" font-size="14">Clean: BiLSTM · noisy: dictionary</text>
  </g>
</svg>
