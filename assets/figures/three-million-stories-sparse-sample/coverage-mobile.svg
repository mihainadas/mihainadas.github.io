<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1010" viewBox="0 0 320 1010" role="img">
  <title>Coverage orders in a six-slot story corpus</title>
  <desc>Mobile diagram comparing full combinations, generated rows, individual values, and pairs.</desc>
  <rect width="320" height="1010" rx="20" fill="#111719"/>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="48" fill="#d2a85a" font-family="ui-monospace, monospace" font-size="12" font-weight="700">COVERAGE HAS AN ORDER</text>
    <text x="24" y="88" fill="#f2f0e8" font-size="23" font-weight="700">Six slots</text>
    <text x="24" y="118" fill="#f2f0e8" font-size="23" font-weight="700">100 values each</text>
    <line x1="24" y1="148" x2="296" y2="148" stroke="#3b474a"/>
    <rect x="24" y="180" width="272" height="155" rx="12" fill="#1b2427"/>
    <text x="42" y="216" fill="#9ca5a2" font-size="12">FULL SPECIFICATIONS</text>
    <text x="42" y="264" fill="#f2f0e8" font-size="24" font-weight="700">1 trillion</text>
    <text x="42" y="296" fill="#9ca5a2" font-size="15">possible combinations</text>
    <rect x="24" y="365" width="272" height="170" rx="12" fill="#202b2e"/>
    <text x="42" y="401" fill="#9ca5a2" font-size="12">GENERATED ROWS</text>
    <text x="42" y="449" fill="#efc978" font-size="24" font-weight="700">3 million</text>
    <text x="42" y="485" fill="#efc978" font-size="19" font-weight="700">0.0003% at most</text>
    <rect x="24" y="565" width="272" height="160" rx="12" fill="#263336"/>
    <text x="42" y="601" fill="#9ca5a2" font-size="12">FIRST ORDER</text>
    <text x="42" y="652" fill="#b9d98d" font-size="23" font-weight="700">≈ 30,000</text>
    <text x="42" y="685" fill="#d9d9d2" font-size="16">per individual value</text>
    <rect x="24" y="755" width="272" height="160" rx="12" fill="#263336"/>
    <text x="42" y="791" fill="#9ca5a2" font-size="12">SECOND ORDER</text>
    <text x="42" y="842" fill="#8bb5ff" font-size="23" font-weight="700">≈ 300</text>
    <text x="42" y="875" fill="#d9d9d2" font-size="16">per cross-slot pair</text>
    <text x="296" y="968" text-anchor="end" fill="#77817f" font-family="ui-monospace, monospace" font-size="10">BALANCED EXPECTATION</text>
  </g>
</svg>
