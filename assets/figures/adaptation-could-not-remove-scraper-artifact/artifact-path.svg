<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
  <title>Observed path of a web scraper artifact through adaptation</title>
  <desc>A suspected web artifact appears in a pretrained checkpoint and survives a rank-16 LoRA adaptation experiment for Romanian diacritic restoration.</desc>
  <rect width="1200" height="600" rx="28" fill="#111719"/>
  <text x="66" y="70" fill="#d2a85a" font-family="ui-monospace, monospace" font-size="18" font-weight="700">ONE CHECKPOINT · ONE OBSERVED ARTIFACT</text>
  <g font-family="system-ui, sans-serif">
    <rect x="66" y="145" width="230" height="220" rx="18" fill="#20282a"/>
    <text x="98" y="190" fill="#9ca5a2" font-size="15">SUSPECTED SOURCE</text><text x="98" y="234" fill="#f2f0e8" font-size="24" font-weight="700">scraped web text</text><text x="98" y="283" fill="#d9d9d2" font-family="ui-monospace, monospace" font-size="16">iframe helpers</text><text x="98" y="318" fill="#d9d9d2" font-family="ui-monospace, monospace" font-size="16">page templates</text>
    <path d="M315 255 H373" stroke="#76878a" stroke-width="3"/><path d="M362 244 L375 255 L362 266" fill="none" stroke="#76878a" stroke-width="3"/>
    <rect x="394" y="145" width="230" height="220" rx="18" fill="#242225"/>
    <text x="426" y="190" fill="#9ca5a2" font-size="15">BASE CHECKPOINT</text><text x="426" y="234" fill="#f2f0e8" font-size="24" font-weight="700">LLMic_v2 3B</text><text x="426" y="283" fill="#efc978" font-family="ui-monospace, monospace" font-size="17">autoResizeIframe</text><text x="426" y="323" fill="#9ca5a2" font-size="16">word accuracy 0.00%</text>
    <path d="M643 255 H701" stroke="#76878a" stroke-width="3"/><path d="M690 244 L703 255 L690 266" fill="none" stroke="#76878a" stroke-width="3"/>
    <rect x="722" y="145" width="190" height="220" rx="18" fill="#1d2926"/>
    <text x="754" y="190" fill="#9ca5a2" font-size="15">ADAPTATION</text><text x="754" y="234" fill="#f2f0e8" font-size="24" font-weight="700">LoRA rank 16</text><text x="754" y="283" fill="#d9d9d2" font-size="18">10,000 steps</text><text x="754" y="323" fill="#d9d9d2" font-size="18">2× schedule</text>
    <path d="M931 255 H989" stroke="#76878a" stroke-width="3"/><path d="M978 244 L991 255 L978 266" fill="none" stroke="#76878a" stroke-width="3"/>
    <rect x="1010" y="145" width="126" height="220" rx="18" fill="#2a2020" stroke="#6f4848"/>
    <text x="1034" y="190" fill="#9ca5a2" font-size="15">OUTPUT</text><text x="1034" y="235" fill="#efc978" font-size="20" font-weight="700">artifact</text><text x="1034" y="265" fill="#efc978" font-size="20" font-weight="700">remains</text><text x="1034" y="323" fill="#9ca5a2" font-size="15">WA 1.45%</text>
    <rect x="66" y="420" width="1070" height="100" rx="14" fill="#1b2427"/>
    <text x="98" y="460" fill="#f2f0e8" font-size="19" font-weight="700">Production decision</text><text x="98" y="494" fill="#d9d9d2" font-size="18">Reject or quarantine this checkpoint before spending another tuning run.</text>
  </g>
  <text x="1136" y="566" text-anchor="end" fill="#77817f" font-family="ui-monospace, monospace" font-size="13">CASE STUDY · NOT A GENERAL LORA CLAIM</text>
</svg>
