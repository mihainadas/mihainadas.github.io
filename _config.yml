title: "Mihai Nadăș"
description: "AI, software-led differentiation, and business decisions. Mihai Nadăș connects technology leadership to public engineering work and language-model research."
url: "https://mihainadas.github.io"
baseurl: ""
lang: en
timezone: Europe/Bucharest

author:
  name: Mihai Nadăș
  email: mihai.nadas@ubbcluj.ro

theme: minima
permalink: /:year/:month/:day/:title.html
show_excerpts: true

header_pages:
  - business.md
  - engineering.md
  - research.md
  - library.md
  - about.md

github_username: mihainadas
linkedin_username: mihainadas
twitter_username: mihainadas

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Mihai Nadăș

exclude:
  - Gemfile
  - Gemfile.lock
  - requirements-post-examples.txt
  - requirements-resume.txt
  - README.md
  - AGENTS.md
  - .cursor
  - scripts
  - tests
  - vendor
  - assets/editorial/README.md
  - assets/media/README.md
  - assets/media-sources
  - docs
