title: "Mihai Nadăș"
description: "Engineering notes on small language models, synthetic data, Romanian NLP, and reproducible evaluation."
url: "https://mihainadas.github.io"
baseurl: ""
lang: en
timezone: Europe/Bucharest

author:
  name: Mihai Nadăș
  email: mihai.nadas@ubbcluj.ro

theme: minima
permalink: /:year/:month/:day/:title.html
show_excerpts: true

header_pages:
  - research.md
  - notebooks.md
  - archive.md
  - about.md

github_username: mihainadas
linkedin_username: mihainadas
twitter_username: mihainadas

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Mihai Nadăș

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
